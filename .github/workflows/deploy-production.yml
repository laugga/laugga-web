# The production deploy for a website.
#
# Copied from laugga/ops, share/workflows/website-production.yml, to this
# repository's .github/workflows/deploy-production.yml. A copy is adapted, not
# kept byte-identical — the marked lines below are this repository's to set.
# The rule it implements is CONVENTIONS.md → Versioning, in laugga/ops: a
# final tag X.Y.Z is the only thing that publishes, so this is the only
# workflow, and a pushed X.Y.Z the only event, that deploys production.
#
# What it does not run on, each on purpose:
#
#   a branch          not dev, whose merges .github/workflows/deploy.yml
#                     publishes to the Development project, and not main,
#                     which follows a final tag and has nothing built or
#                     deployed from it
#   a beta or rc tag  a website has neither lane, and one pushed by mistake
#                     must not publish
#   a pull request    so it never reports there as a check the Require CI
#                     ruleset would pick up, and so the sign-in is never
#                     offered to a branch
#   a person          there is no workflow_dispatch. Do not add one to try it:
#                     the sign-in below is refused to anything but a tag
#
# The tag is cut by /cut-release, in laugga/ops, on dev or on a release/X.Y.Z
# line, and never on main. A tag on a commit neither of those holds is refused
# here before anything is built.
#
# It stores no credential. It signs in with Workload Identity Federation, the
# way deploy.yml does, but in the production project: the run's own GitHub
# OIDC token is exchanged there for a short-lived credential as the service
# account github-deploy, which may deploy Hosting there and nothing else. The
# provider there accepts a token only from a run on a tag, where the
# Development project's accepts one only from dev, so the sign-in cannot be
# tried from a branch or a pull request, and one it refuses is fixed on
# Google's side, not here. Only an organisation owner can push a tag: the
# organisation's Protect tags ruleset.

name: Deploy production

on:
  push:
    # A final tag, X.Y.Z, and nothing else. `+` is one or more of the
    # character before it and a `.` is itself, so neither 1.2.0-beta.1 nor
    # 1.2.0-rc.1 nor v1.2.0 matches. The first step of the job says so again.
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

# One production deploy at a time, and never cancelled half-way.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  # To ask GitHub for the run's OIDC token, which is what the sign-in presents.
  id-token: write

env:
  # The two lines of this file a repository sets, and the only two: nothing
  # else in it names the site. Both are the production project's of this
  # repository's Domain — its number in the first, its ID in the second — and
  # neither is a secret. CONVENTIONS.md → One deployment contract says what
  # has to exist on Google's side for them to work.
  WORKLOAD_IDENTITY_PROVIDER: projects/1095622935123/locations/global/workloadIdentityPools/github/providers/github
  SERVICE_ACCOUNT: github-deploy@laugga-45434.iam.gserviceaccount.com

jobs:
  deploy:
    name: Deploy the tag to the production project
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # A final tag is a release, and a release that deployed nothing has to
      # say so where the person who cut it will look. So this fails, where
      # deploy.yml only warns: a merge into dev can come before a repository
      # has its project, and a final tag cannot.
      - name: Is the sign-in set?
        run: |
          case "$WORKLOAD_IDENTITY_PROVIDER $SERVICE_ACCOUNT" in
            *REPLACE-ME*)
              echo "::error title=$GITHUB_REF_NAME was not deployed::WORKLOAD_IDENTITY_PROVIDER and SERVICE_ACCOUNT, in .github/workflows/deploy-production.yml, are still placeholders, so this run has no production project to sign in to."
              exit 1
              ;;
          esac

      - uses: actions/checkout@v7
        with:
          # All of history, and every branch: the next step asks which lines
          # hold the tagged commit, and version.sh, which the build reads its
          # version from, refuses to count commits in a shallow clone.
          fetch-depth: 0

      # Twice over what the trigger already says, because a release is the one
      # thing here that cannot be taken back: the tag is X.Y.Z, and its commit
      # is on dev or on a release/X.Y.Z line. A tag on main, or on a commit no
      # line holds, is one no release was cut from.
      - name: Is this a release?
        run: |
          tag=$GITHUB_REF_NAME
          if ! printf '%s\n' "$tag" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error title=$tag was not deployed::Only a final tag, X.Y.Z, deploys production."
            exit 1
          fi
          commit=$(git rev-parse 'HEAD^{commit}')
          on=
          for line in $(git for-each-ref --format='%(refname:short)' \
              refs/remotes/origin/dev 'refs/remotes/origin/release/*'); do
            case $line in
              origin/dev) ;;
              *) printf '%s\n' "$line" | grep -Eq '^origin/release/[0-9]+\.[0-9]+\.[0-9]+$' || continue ;;
            esac
            if git merge-base --is-ancestor "$commit" "$line"; then
              on=${line#origin/}
              break
            fi
          done
          if [ -z "$on" ]; then
            echo "::error title=$tag was not deployed::Its commit, $commit, is on neither dev nor a release/X.Y.Z branch. A release is cut on one of those, never on main: CONVENTIONS.md → Versioning, in laugga/ops."
            exit 1
          fi
          echo "$tag is $commit, on $on"

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      # Pinned, and to the version deploy.yml pins: the CLI that deploys
      # changes only when this line does. Printing the version proves it runs
      # on the runner's Node before anything is signed in.
      - name: Install firebase-tools
        run: |
          npm install --global firebase-tools@15.32.1
          firebase --version

      - name: make build
        run: make build

      # The suites the gate ran on each pull request, run again on exactly
      # what is about to be public, so a build that fails them is never
      # published.
      - name: make test
        run: make test

      # After checkout, because the credentials file it writes goes into the
      # workspace, which checkout empties. After the install, the build and
      # the tests, so that the deploy is the only step that runs with a
      # credential. It exports GOOGLE_APPLICATION_CREDENTIALS, which firebase
      # reads.
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.SERVICE_ACCOUNT }}

      # `production` is the name .firebaserc gives the production project of
      # this repository's Domain. Which Hosting site there is firebase.json's
      # and .firebaserc's to say, as it is for every other deploy.
      - name: Deploy to Hosting
        run: firebase deploy --only hosting --project production --non-interactive
